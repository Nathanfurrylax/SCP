services:
  - type: web
    name: scp-foundation
    runtime: python
    plan: starter            # un disque persistant nécessite un plan payant
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false          # ex. https://TON-SITE.onrender.com/auth/callback
      - key: ADMIN_DISCORD_IDS
        sync: false
    disk:
      name: scp-data
      mountPath: /var/data
      sizeGB: 1
